# Xcode project definition.
#
# Generated with `xcodegen generate` rather than committed as a .pbxproj:
# that file is machine-written, merges badly, and hides real changes in noise.
# This is the source of truth — regenerate after editing.
#
# SIGNING IS DELIBERATELY UNSET. The app builds and runs in the simulator as
# is. To run on a device or ship, set DEVELOPMENT_TEAM to the Apple Team ID
# (10 characters, under Membership in the developer account).
name: Albus
options:
  bundleIdPrefix: com.felipegutierrez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  AlbusCore:
    path: AlbusCore
  # Official client. Chosen over hand-rolled URLSession calls because the auth
  # token lifecycle — refresh, expiry margins, concurrent refresh — is
  # security-critical and easy to get subtly wrong.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No team set on purpose — see the note above.
    CODE_SIGN_STYLE: Automatic
    # Signing stays off until there is a real Apple Team ID.
    #
    # App/Albus/Albus.entitlements declares the Keychain access group the auth
    # session needs. Enabling it here (ad-hoc signing) was tried and rejected:
    # it produced an application-identifier the simulator container did not
    # match, and SwiftData then failed with "Sandbox access to file-write-create
    # denied" — a working app traded for an unverifiable entitlement.
    #
    # Consequence, documented rather than hidden: on the SIMULATOR the session
    # is not persisted, so each fresh install signs in as a new anonymous user.
    # On a signed device build the entitlement applies and the session survives.
    # Quota enforcement does not depend on this — see the global spend fuse in
    # migration 0013, which bounds abuse regardless of how many accounts exist.
    CODE_SIGNING_ALLOWED: NO

targets:
  Albus:
    type: application
    platform: iOS
    sources:
      - path: App/Albus
    dependencies:
      - package: AlbusCore
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: App/Config.xcconfig
      Release: App/Config.xcconfig
    info:
      path: App/Albus/Info.plist
      properties:
        CFBundleDisplayName: Albus
        UILaunchScreen: {}
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app talks only to Supabase over HTTPS; no cleartext exceptions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felipegutierrez.albus
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        # Set per-SDK: the project-level value loses to Xcode's iOS default
        # ("iPhone Developer"), which needs a team we deliberately do not have.
        # Ad-hoc is enough for the simulator and carries the entitlement.
        # Applied automatically once DEVELOPMENT_TEAM is set; see ios/README.md.
        CODE_SIGN_ENTITLEMENTS: App/Albus/Albus.entitlements

  AlbusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AlbusTests
    dependencies:
      - target: Albus
      - package: AlbusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AlbusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/AlbusUITests
    dependencies:
      - target: Albus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Albus:
    build:
      targets:
        Albus: all
        AlbusTests: [test]
        AlbusUITests: [test]
    test:
      targets:
        - AlbusTests
        # AlbusUITests makes a REAL backend call and costs money, so CI passes
        # -skip-testing:AlbusUITests. Run it deliberately:
        #   xcodebuild test -scheme Albus -only-testing:AlbusUITests
        - AlbusUITests
    run:
      config: Debug
